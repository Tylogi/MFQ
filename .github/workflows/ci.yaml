name: Native build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux storage and expert cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure portable runtime tests
        run: >-
          cmake -S csrc -B build/linux-core -DCMAKE_BUILD_TYPE=Release
          -DMFQ_BUILD_CUDA_RUNTIME=OFF -DMFQ_BUILD_HIP_RUNTIME=OFF
          -DMFQ_BUILD_METAL_RUNTIME=OFF -DMFQ_BUILD_RUNTIME_COMMUNICATION=OFF
          -DBUILD_TESTING=ON
      - name: Build storage and cache regression tests
        run: >-
          cmake --build build/linux-core --parallel 2 --target
          mfq-file-range-reader-test mfq-model-source-test mfq-quant-expert-range-test
          mfq-moe-cache-policy-test mfq-moe-cache-profile-test mfq-native-tensor-test
      - name: Run Linux regression tests
        run: >-
          ctest --test-dir build/linux-core --output-on-failure
          -R '^mfq-(file-range-reader|model-source|quant-expert-range|moe-cache-policy|moe-cache-profile|native-tensor)-test$'

  macos-metal:
    name: macOS Metal
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync dependencies
        run: uv sync --extra metal

      - name: Build
        run: uv run mfq build

      - name: Check text prefill chunking
        run: |
          cmake --build build/csrc --target mfq-metal-qwen35-causal-lm-test mfq-metal-minicpmo45-test
          ctest --test-dir build/csrc --output-on-failure -R '^mfq-metal-(qwen35-causal-lm|minicpmo45)-test$'

  cuda-source-hygiene:
    name: CUDA source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Keep the CUDA backend include graph a DAG
        run: python3 tests/test_cuda_include_graph.py
      - name: Keep MFQ_* knobs behind the env module
        run: |
          ! grep -rn --include='*.cpp' --include='*.cu' --include='*.cuh' --include='*.h' \
              -E '(std::)?getenv\(|[^_a-z](setenv|unsetenv)\(|_putenv_s\(' csrc/backends/cuda \
            | grep -v -e 'backends/cuda/native/env\.cpp:' -e 'backends/cuda/commands/runtime\.cpp:'
