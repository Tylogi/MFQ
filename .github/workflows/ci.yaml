name: Native build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-metal:
    name: macOS Metal
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync dependencies
        run: uv sync --extra metal

      - name: Build
        run: uv run mfq build

      - name: Check text prefill chunking
        run: |
          cmake --build build/cpp_runtime --target mfq-metal-qwen35-causal-lm-test mfq-metal-minicpmo45-test
          ctest --test-dir build/cpp_runtime --output-on-failure -R '^mfq-metal-(qwen35-causal-lm|minicpmo45)-test$'
