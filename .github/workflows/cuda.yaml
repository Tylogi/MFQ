name: CUDA numerical regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfq-cuda-regression
  cancel-in-progress: false

jobs:
  cuda:
    # A dedicated GPU runner; fork PRs never execute automatically on this host.
    runs-on: [self-hosted, linux, x64, mfq-cuda]
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ${{ vars.MFQ_CI_GPU_UUID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify assigned GPU and disk workspace
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CUDA_VISIBLE_DEVICES"
          nvidia-smi -i "$CUDA_VISIBLE_DEVICES" --query-gpu=uuid,name,memory.free --format=csv
          case "$(findmnt -n -o FSTYPE -T "$GITHUB_WORKSPACE")" in
            tmpfs|ramfs) echo 'CUDA CI requires a disk workspace'; exit 1 ;;
          esac
          mkdir -p .cuda-ci-tmp
          echo "TMPDIR=$GITHUB_WORKSPACE/.cuda-ci-tmp" >> "$GITHUB_ENV"
      - name: Build native CUDA regression targets
        run: |
          cmake -S cpp_runtime -B build/cuda-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DMFQ_CUDA_ARCHITECTURES=native -DBUILD_TESTING=ON -DMFQ_BUILD_METAL_RUNTIME=OFF
          cmake --build build/cuda-ci --target mfq-native-tensor-cuda-test mfq-cuda-context-test mfq-nint-q8-test mfq-mxfp4-sq-test mfq-packed-prefill-test mfq-sq-linear-test
      - name: Run GPU numerical, graph and timing checks
        run: |
          ctest --test-dir build/cuda-ci --output-on-failure -V -R '^mfq-(native-tensor-cuda|cuda-context|nint-q8|packed-prefill)-test$'
          python3 bench/cuda_mxfp4_sq_fixtures.py build/cuda-ci/sq-fixtures
          build/cuda-ci/cuda/mfq-mxfp4-sq-test build/cuda-ci/sq-fixtures
          build/cuda-ci/cuda/mfq-sq-linear-test build/cuda-ci/sq-fixtures
